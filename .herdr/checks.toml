# Checks `herdr todo run --check NAME...` may run to verify a worker's commit
# (and the command that installs master after the cherry-pick):
# each name maps to a program and its arguments, run as they are in the
# worker's folder (no shell, so nothing is expanded or split). The driver
# reads this file from the shared checkout at preflight and keeps the argv
# with the run, so a worker's commit cannot change its own check.

[checks]
workers = ["cargo", "nextest", "run", "-E", "test(/workers::/)"]
api-schema = ["cargo", "nextest", "run", "-E", "test(generated_protocol_schema_artifact_is_current)"]
tests = ["cargo", "nextest", "run"]
# Windows clippy with the configured SDK (`just windows-lint`), so unix-only
# code that is dead on Windows fails the verify instead of the coordinator's
# clean-install.
windows-lint = ["python3", "scripts/windows_cross.py", "lint"]
# The maintenance script tests (`just maintenance-test`), which hold the
# config reference docs check that `just check` runs.
maintenance = ["just", "maintenance-test"]
# The rest of `just check`'s recipes: formatting and clippy (`lint`), and the
# UI hot-path architecture, integration asset and docs contract tests. The
# verify adds every one of these checks, and `tests` and `windows-lint`, by
# itself to a run whose diff touches the paths its recipe reads (`lint`,
# `windows-lint` and `tests` for every Rust change), so a commit it passes
# does not fail the install's `just check`.
lint = ["just", "lint"]
ui-architecture = ["just", "ui-hot-path-architecture-test"]
integration-assets = ["just", "integration-assets-test"]
docs-contract = ["just", "docs-contract-test"]

[preflight]
# The free disk below which preflight refuses a run (`just guard`'s limit).
min_free_gib = 15

[counterfactual]
# The verify proves that the tests a commit adds or changes fail without it:
# it puts their whole `#[cfg(test)]` module (or the whole file of
# `test_globs`) on the commit's base in the worker's folder and runs each one
# there, by its module-qualified name. A repository opts in by having this
# table; `herdr todo run --new-api` accepts a base that does not build with
# the commit's tests (it adds an API the base cannot compile against).
language = "rust"
# A whole file is taken from the commit: a test crate is its own root.
test_globs = ["tests/**", "**/*_test.rs"]
# Builds the base with the commit's test scopes; `--no-run` builds only.
build = ["cargo", "nextest", "run", "--no-run", "--locked"]
# Runs one test there; `--no-tests=fail` makes a filter that matches nothing
# exit non-zero, which never counts as proof.
run = [
  "cargo",
  "nextest",
  "run",
  "--locked",
  "--no-tests=fail",
  "-E",
  "test(={test})",
]

[install]
# After the cherry-pick, `herdr todo run` installs master with this argv, in
# the shared checkout with the coordinator's environment: `just check`, the
# release build and the live install in the clean tree, under one lock (the
# path is one `clean-tree` applies; it needs one). `build_id` prints the
# installed build: its first word is master's commit for a clean build, which
# lets a run cut off after its install see that it is done.
command = ["just", "clean-install", "TODO.md"]
build_id = ["herdr", "--build-commit"]
