id = "local.oracle"
name = "Oracle"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Second-opinion skills (GPT, Gemini, DeepSeek) for coding agents, with usage and usefulness stats"
platforms = ["macos", "linux"]

# less keeps long tables readable; q closes the popup.
[[panes]]
id = "stats"
title = "Oracle stats"
placement = "popup"
width = "90%"
height = "80%"
command = ["sh", "-c", "skills/oracle-stats/oracle.py stats --pairs 2>&1 | less -RS"]

[[panes]]
id = "recent"
title = "Oracle: recent calls"
placement = "popup"
width = "90%"
height = "80%"
command = ["sh", "-c", "skills/oracle-stats/oracle.py recent -n 40 2>&1 | less -RS"]

[[panes]]
id = "install-skills"
title = "Oracle: install skills"
placement = "popup"
width = "80%"
height = 20
command = ["sh", "-c", "./install-skills; printf '\\nEnter closes. '; read -r _"]
