id = "local.job"
name = "Jobs"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Run long commands in their own tab and show them in the sidebar of the pane that started them"
platforms = ["macos", "linux"]

[[panes]]
id = "list"
title = "Jobs"
placement = "popup"
width = "80%"
height = 20
command = ["sh", "-c", "./herdr-job list; printf '\\nEnter closes. '; read -r _"]

# Links the commands into ~/.local/bin and asks whether to add the herdr-job
# instructions to each agent's global instruction file (see ./install).
[[panes]]
id = "setup"
title = "Jobs: set up for agents"
placement = "popup"
width = "80%"
height = 20
command = ["sh", "-c", "./install; printf '\\nEnter closes. '; read -r _"]

# Recount the `$jobs` token of the pane that started a job when its tab closes.
[[events]]
on = "tab.closed"
command = ["./herdr-job", "_tab-closed"]

# Ctrl+click on a `herdr-job://<id>` link (the Pi activity extension prints one
# on a job's row) focuses that job's tab.
[[actions]]
id = "open-job"
title = "Open job"
command = ["./herdr-job", "open", "--from-click"]

[[link_handlers]]
id = "job"
title = "Open job"
pattern = "^herdr-job://[0-9]{8}-[0-9]{6}-[0-9a-f]{4}$"
action = "open-job"
