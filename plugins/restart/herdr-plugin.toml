id = "local.restart"
name = "Restart agents"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Restart idle agent CLIs (Claude, pi) in place, resuming their sessions with their launch flags"
platforms = ["macos", "linux"]

[[actions]]
id = "restart-pane"
title = "Restart agent in this pane"
contexts = ["workspace"]
command = ["python3", "restart_agent.py", "--focused"]

[[actions]]
id = "restart-workspace"
title = "Restart idle agents in this workspace"
contexts = ["workspace"]
command = ["python3", "restart_agent.py", "--workspace"]
