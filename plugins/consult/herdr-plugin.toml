id = "local.consult"
name = "Consult"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Second-opinion skills (GPT, Gemini, DeepSeek) for coding agents, with usage and usefulness stats"
platforms = ["macos", "linux"]

# less keeps long tables readable; q closes the popup.
[[panes]]
id = "stats"
title = "Consult stats"
placement = "popup"
width = "90%"
height = "80%"
command = ["sh", "-c", "skills/consult-stats/consult.py stats --pairs 2>&1 | less -RS"]

[[panes]]
id = "recent"
title = "Consult: recent calls"
placement = "popup"
width = "90%"
height = "80%"
command = ["sh", "-c", "skills/consult-stats/consult.py recent -n 40 2>&1 | less -RS"]

[[panes]]
id = "install-skills"
title = "Consult: install skills"
placement = "popup"
width = "80%"
height = 20
command = ["sh", "-c", "./install-skills; printf '\\nEnter closes. '; read -r _"]
