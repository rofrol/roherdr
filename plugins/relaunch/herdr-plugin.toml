id = "local.relaunch"
name = "Relaunch tab programs"
version = "0.3.0"
min_herdr_version = "0.9.0"
description = "Remember foreground programs in panes and relaunch them after a server restart"
platforms = ["macos", "linux"]

[[actions]]
id = "preview"
title = "Relaunch: preview (dry run)"
contexts = ["workspace"]
command = ["node", "relaunch.js", "--dry-run"]

# Adds the zsh hook to ~/.zshrc; see README.md.
[[panes]]
id = "install-zsh-hook"
title = "Relaunch: install zsh hook"
placement = "popup"
width = "80%"
height = 12
command = ["sh", "-c", "./install; printf '\\nEnter closes. '; read -r _"]

[[startup]]
command = ["node", "relaunch.js"]
