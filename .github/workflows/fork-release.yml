name: Fork release

# Builds the fork's binaries and publishes them as a GitHub (pre)release. Fork only: upstream's
# release.yml needs its maintainers, secrets, Homebrew, Nix and website, none of which exist here.
#
#   git tag fork-v0.9.3-1 && git push origin fork-v0.9.3-1
#   gh workflow run fork-release.yml -f tag=fork-v0.9.3-1      (builds the same tag by hand)
#
# The binary stays `herdr`; only the asset names carry the fork's name (FORK_NAME below: roherdr).

on:
  push:
    tags: ["fork-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: release tag to create or update, e.g. fork-v0.9.3-1
        required: true
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RUST_TOOLCHAIN_VERSION: 1.96.1
  FORK_NAME: roherdr
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  LIBGHOSTTY_VT_OPTIMIZE: ReleaseSafe
  LIBGHOSTTY_VT_SIMD: "false"

jobs:
  build-unix:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            asset: linux-x86_64
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            asset: linux-aarch64
          - target: aarch64-apple-darwin
            os: macos-latest
            asset: macos-aarch64
          - target: x86_64-apple-darwin
            os: macos-latest
            asset: macos-x86_64
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: ${{ matrix.target }}

      - name: Install Zig
        uses: vercel-labs/setup-zig@83c1594f26b86da8a9a8ddd9b5ee5f3af0f96943 # v1.0.2
        with:
          version: 0.16.0

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo find /etc/apt/sources.list.d -type f \( -iname '*microsoft*' -o -iname '*azure-cli*' \) -print -delete
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build musl-tools gcc-aarch64-linux-gnu crossbuild-essential-arm64

      - name: Set Linux aarch64 linker
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew install cmake ninja

      - name: Remove Zig caches
        run: rm -rf .zig-cache vendor/libghostty-vt/.zig-cache vendor/libghostty-vt/zig-out

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        run: |
          cp target/${{ matrix.target }}/release/herdr "$FORK_NAME-${{ matrix.asset }}"
          chmod +x "$FORK_NAME-${{ matrix.asset }}"
          if [ "$RUNNER_OS" = Linux ]; then
            file "$FORK_NAME-${{ matrix.asset }}" | grep -Eq "statically linked|static-pie linked"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ env.FORK_NAME }}-${{ matrix.asset }}
          path: ${{ env.FORK_NAME }}-${{ matrix.asset }}
          retention-days: 7

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: x86_64-pc-windows-msvc

      - name: Install Zig
        uses: vercel-labs/setup-zig@83c1594f26b86da8a9a8ddd9b5ee5f3af0f96943 # v1.0.2
        with:
          version: 0.16.0

      - name: Build
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Package with the ConPTY runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $package = Join-Path $env:RUNNER_TEMP "Microsoft.Windows.Console.ConPTY.nupkg"
          $stage = Join-Path $env:RUNNER_TEMP "$env:FORK_NAME-windows-x86_64"
          .\scripts\package_windows_conpty.ps1 `
            -HerdrExe target\x86_64-pc-windows-msvc\release\herdr.exe `
            -PackagePath $package `
            -StageDir $stage `
            -OutputPath "$env:FORK_NAME-windows-x86_64.zip"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ env.FORK_NAME }}-windows-x86_64
          path: ${{ env.FORK_NAME }}-windows-x86_64.zip
          retention-days: 7

  publish:
    needs: [build-unix, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: assets
          merge-multiple: true

      - name: Checksums
        run: |
          cd assets
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" assets/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" assets/* --prerelease \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TAG" \
              --notes "Fork build of $GITHUB_SHA. The binary is named herdr; see SHA256SUMS." \
              --repo "$GITHUB_REPOSITORY"
          fi
